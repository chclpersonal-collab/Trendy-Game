name: Playwright Vercel Playtest

on:
  push:
    branches:
      - 'update/**'
    paths:
      - 'game.html'
      - 'styles.css'
      - 'src/**'
      - 'tests/**'
      - 'package.json'
      - 'playwright.config.cjs'
      - 'vercel.json'
      - '.github/workflows/playwright.yml'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Optional deployed URL to test instead of auto-discovery'
        required: false
        type: string

concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  playtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Resolve successful Vercel preview
        env:
          GH_TOKEN: ${{ github.token }}
          MANUAL_BASE_URL: ${{ github.event.inputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          url="${MANUAL_BASE_URL:-}"

          if [[ -z "$url" ]]; then
            for attempt in $(seq 1 12); do
              deployments="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments?sha=${GITHUB_SHA}&per_page=100")"
              while read -r deployment_id; do
                [[ -z "$deployment_id" ]] && continue
                statuses="$(gh api --method GET "repos/${GITHUB_REPOSITORY}/deployments/${deployment_id}/statuses?per_page=20")"
                candidate="$(jq -r '[.[] | select(.state == "success") | (.environment_url // .target_url // "") | select(contains("vercel.app"))][0] // empty' <<<"$statuses")"
                if [[ -n "$candidate" ]]; then
                  url="$candidate"
                  break
                fi
              done < <(jq -r '.[].id' <<<"$deployments")

              [[ -n "$url" ]] && break
              echo "Waiting for Vercel deployment status ($attempt/12)..."
              sleep 5
            done
          fi

          if [[ -z "$url" ]]; then
            branch_slug="$(printf '%s' "$GITHUB_REF_NAME" | tr '[:upper:]' '[:lower:]' | sed 's#/#-#g; s/\.//g; s/[^a-z0-9-]//g')"
            url="https://trendy-game-git-${branch_slug}-chclpersonal-9731s-projects.vercel.app"
            echo "No successful deployment_status URL was found within 60 seconds; using branch alias fallback: $url"
          fi

          url="${url%/}"
          echo "PLAYWRIGHT_BASE_URL=$url" >> "$GITHUB_ENV"
          echo "### Playwright target" >> "$GITHUB_STEP_SUMMARY"
          echo "\`$url\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify automation bypass secret exists
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${VERCEL_AUTOMATION_BYPASS_SECRET:-}" ]]; then
            echo "::error::VERCEL_AUTOMATION_BYPASS_SECRET is missing from GitHub Actions secrets."
            exit 1
          fi

      - name: Run deployed browser playtests
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: npm run test:e2e

      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            playwright-report/
            test-results/
          if-no-files-found: warn
          retention-days: 14
